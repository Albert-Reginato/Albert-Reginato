<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 512" width="560" height="512"
     role="img" aria-label="Logo Multiverso: as alcas se entrelacam ate formar o simbolo">

  <defs>
    <!-- Um gradiente so para as cinco alcas, cobrindo o simbolo inteiro.
         So funciona porque nenhuma alca usa rotate: elas ja nascem giradas. -->
    <linearGradient id="tubo" gradientUnits="userSpaceOnUse" x1="0" y1="-176" x2="0" y2="162">
      <stop offset="0%" stop-color="#7DF8FF"/>
      <stop offset="18%" stop-color="#35DCF7"/>
      <stop offset="40%" stop-color="#2496FF"/>
      <stop offset="60%" stop-color="#3A62FF"/>
      <stop offset="80%" stop-color="#7B3FF2"/>
      <stop offset="100%" stop-color="#C13BFF"/>
    </linearGradient>
    <linearGradient id="luz" gradientUnits="userSpaceOnUse" x1="0" y1="-176" x2="0" y2="162">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".78"/>
      <stop offset="45%" stop-color="#D9FAFF" stop-opacity=".40"/>
      <stop offset="100%" stop-color="#F3D7FF" stop-opacity=".26"/>
    </linearGradient>
    <linearGradient id="palavra" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="440" y2="0">
      <stop offset="0%" stop-color="#45E9FF"/>
      <stop offset="40%" stop-color="#2E8BFF"/>
      <stop offset="60%" stop-color="#7B4BFF"/>
      <stop offset="100%" stop-color="#D65CFF"/>
    </linearGradient>

    <filter id="brilho" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="brilhoP" x="-30%" y="-90%" width="160%" height="280%"><feGaussianBlur stdDeviation="7"/></filter>

    <style>
      @keyframes a1 { 0%,4%{stroke-dashoffset:100}  24%,100%{stroke-dashoffset:0} }
      @keyframes a2 { 0%,9%{stroke-dashoffset:100}  29%,100%{stroke-dashoffset:0} }
      @keyframes a3 { 0%,14%{stroke-dashoffset:100} 34%,100%{stroke-dashoffset:0} }
      @keyframes a4 { 0%,19%{stroke-dashoffset:100} 39%,100%{stroke-dashoffset:0} }
      @keyframes a5 { 0%,24%{stroke-dashoffset:100} 44%,100%{stroke-dashoffset:0} }

      @keyframes ciclo   { 0%{opacity:0} 4%{opacity:1} 92%{opacity:1} 100%{opacity:0} }
      @keyframes estalo  { 0%,42%{opacity:.22} 50%{opacity:.95} 64%,100%{opacity:.5} }
      @keyframes palavra { 0%,46%{opacity:0;transform:translateY(16px)} 60%,100%{opacity:1;transform:translateY(0)} }
      @keyframes giro    { 0%,46%{transform:rotate(-16deg) scale(.88)} 64%,100%{transform:rotate(0deg) scale(1)} }

      .no   { animation: ciclo 6.5s ease-in-out infinite; }
      .gira { transform-box: fill-box; transform-origin: center; animation: giro 6.5s cubic-bezier(.2,.85,.3,1) infinite; }
      .halo { animation: estalo 6.5s ease-in-out infinite; }
      .nome { animation: palavra 6.5s ease-out infinite; }

      .d1 { animation: a1 6.5s ease-in-out infinite; }
      .d2 { animation: a2 6.5s ease-in-out infinite; }
      .d3 { animation: a3 6.5s ease-in-out infinite; }
      .d4 { animation: a4 6.5s ease-in-out infinite; }
      .d5 { animation: a5 6.5s ease-in-out infinite; }

      .alca { fill: none; stroke-linecap: round; stroke-dasharray: 100; }

      /* Sem animacao o simbolo ja aparece montado: nada fica invisivel. */
      @media (prefers-reduced-motion: reduce) {
        .no,.gira,.halo,.nome,.d1,.d2,.d3,.d4,.d5 { animation: none; }
        .alca { stroke-dasharray: none; stroke-dashoffset: 0; }
        .nome { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="560" height="512" fill="#04060F" rx="16"/>

  <ellipse cx="280" cy="490" rx="250" ry="15" fill="#2B86FF" opacity=".16" filter="url(#brilho)"/>
  <ellipse cx="280" cy="490" rx="150" ry="9" fill="#A93CFF" opacity=".22" filter="url(#brilho)"/>

  <g class="no">
    <g class="gira">
      <g transform="translate(280,200)">

        <g class="halo" filter="url(#brilho)" opacity=".5">
          <path class="alca d1" pathLength="100" d="M 86 -84 A 86 92 0 1 1 -86 -84 A 86 92 0 1 1 86 -84" stroke="url(#tubo)" stroke-width="32"/>
          <path class="alca d2" pathLength="100" d="M 106.46 55.83 A 86 92 72 1 1 53.31 -107.75 A 86 92 72 1 1 106.46 55.83" stroke="url(#tubo)" stroke-width="32"/>
          <path class="alca d3" pathLength="100" d="M -20.2 118.51 A 86 92 144 1 1 118.95 17.41 A 86 92 144 1 1 -20.2 118.51" stroke="url(#tubo)" stroke-width="32"/>
          <path class="alca d4" pathLength="100" d="M -118.95 17.41 A 86 92 216 1 1 20.2 118.51 A 86 92 216 1 1 -118.95 17.41" stroke="url(#tubo)" stroke-width="32"/>
          <path class="alca d5" pathLength="100" d="M -53.31 -107.75 A 86 92 288 1 1 -106.46 55.83 A 86 92 288 1 1 -53.31 -107.75" stroke="url(#tubo)" stroke-width="32"/>
        </g>

        <path class="alca d1" pathLength="100" d="M 86 -84 A 86 92 0 1 1 -86 -84 A 86 92 0 1 1 86 -84" stroke="#04060F"     stroke-width="45"/>
        <path class="alca d1" pathLength="100" d="M 86 -84 A 86 92 0 1 1 -86 -84 A 86 92 0 1 1 86 -84" stroke="url(#tubo)" stroke-width="32"/>
        <g transform="translate(3,5)">
          <path class="alca d1" pathLength="100" d="M 86 -84 A 86 92 0 1 1 -86 -84 A 86 92 0 1 1 86 -84" stroke="#0A0A2E" stroke-width="9" opacity=".34"/>
        </g>
        <g transform="translate(-4,-6)">
          <path class="alca d1" pathLength="100" d="M 86 -84 A 86 92 0 1 1 -86 -84 A 86 92 0 1 1 86 -84" stroke="url(#luz)" stroke-width="8"/>
        </g>

        <path class="alca d2" pathLength="100" d="M 106.46 55.83 A 86 92 72 1 1 53.31 -107.75 A 86 92 72 1 1 106.46 55.83" stroke="#04060F"     stroke-width="45"/>
        <path class="alca d2" pathLength="100" d="M 106.46 55.83 A 86 92 72 1 1 53.31 -107.75 A 86 92 72 1 1 106.46 55.83" stroke="url(#tubo)" stroke-width="32"/>
        <g transform="translate(3,5)">
          <path class="alca d2" pathLength="100" d="M 106.46 55.83 A 86 92 72 1 1 53.31 -107.75 A 86 92 72 1 1 106.46 55.83" stroke="#0A0A2E" stroke-width="9" opacity=".34"/>
        </g>
        <g transform="translate(-4,-6)">
          <path class="alca d2" pathLength="100" d="M 106.46 55.83 A 86 92 72 1 1 53.31 -107.75 A 86 92 72 1 1 106.46 55.83" stroke="url(#luz)" stroke-width="8"/>
        </g>

        <path class="alca d3" pathLength="100" d="M -20.2 118.51 A 86 92 144 1 1 118.95 17.41 A 86 92 144 1 1 -20.2 118.51" stroke="#04060F"     stroke-width="45"/>
        <path class="alca d3" pathLength="100" d="M -20.2 118.51 A 86 92 144 1 1 118.95 17.41 A 86 92 144 1 1 -20.2 118.51" stroke="url(#tubo)" stroke-width="32"/>
        <g transform="translate(3,5)">
          <path class="alca d3" pathLength="100" d="M -20.2 118.51 A 86 92 144 1 1 118.95 17.41 A 86 92 144 1 1 -20.2 118.51" stroke="#0A0A2E" stroke-width="9" opacity=".34"/>
        </g>
        <g transform="translate(-4,-6)">
          <path class="alca d3" pathLength="100" d="M -20.2 118.51 A 86 92 144 1 1 118.95 17.41 A 86 92 144 1 1 -20.2 118.51" stroke="url(#luz)" stroke-width="8"/>
        </g>

        <path class="alca d4" pathLength="100" d="M -118.95 17.41 A 86 92 216 1 1 20.2 118.51 A 86 92 216 1 1 -118.95 17.41" stroke="#04060F"     stroke-width="45"/>
        <path class="alca d4" pathLength="100" d="M -118.95 17.41 A 86 92 216 1 1 20.2 118.51 A 86 92 216 1 1 -118.95 17.41" stroke="url(#tubo)" stroke-width="32"/>
        <g transform="translate(3,5)">
          <path class="alca d4" pathLength="100" d="M -118.95 17.41 A 86 92 216 1 1 20.2 118.51 A 86 92 216 1 1 -118.95 17.41" stroke="#0A0A2E" stroke-width="9" opacity=".34"/>
        </g>
        <g transform="translate(-4,-6)">
          <path class="alca d4" pathLength="100" d="M -118.95 17.41 A 86 92 216 1 1 20.2 118.51 A 86 92 216 1 1 -118.95 17.41" stroke="url(#luz)" stroke-width="8"/>
        </g>

        <path class="alca d5" pathLength="100" d="M -53.31 -107.75 A 86 92 288 1 1 -106.46 55.83 A 86 92 288 1 1 -53.31 -107.75" stroke="#04060F"     stroke-width="45"/>
        <path class="alca d5" pathLength="100" d="M -53.31 -107.75 A 86 92 288 1 1 -106.46 55.83 A 86 92 288 1 1 -53.31 -107.75" stroke="url(#tubo)" stroke-width="32"/>
        <g transform="translate(3,5)">
          <path class="alca d5" pathLength="100" d="M -53.31 -107.75 A 86 92 288 1 1 -106.46 55.83 A 86 92 288 1 1 -53.31 -107.75" stroke="#0A0A2E" stroke-width="9" opacity=".34"/>
        </g>
        <g transform="translate(-4,-6)">
          <path class="alca d5" pathLength="100" d="M -53.31 -107.75 A 86 92 288 1 1 -106.46 55.83 A 86 92 288 1 1 -53.31 -107.75" stroke="url(#luz)" stroke-width="8"/>
        </g>

      </g>
    </g>

    <g class="nome">
      <text x="280" y="470" text-anchor="middle" filter="url(#brilhoP)" opacity=".55"
            font-family="Segoe UI, Arial Black, Arial, sans-serif" font-size="50" font-weight="800"
            letter-spacing="3" fill="url(#palavra)">MULTIVERSO</text>
      <text x="280" y="470" text-anchor="middle"
            font-family="Segoe UI, Arial Black, Arial, sans-serif" font-size="50" font-weight="800"
            letter-spacing="3" fill="url(#palavra)">MULTIVERSO</text>
    </g>
  </g>
</svg>
