<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220"
     role="img" aria-label="Frota Multiverso — caminhoes VW Delivery 11-150 em rota">

  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2BE9F5"/>
      <stop offset="40%"  stop-color="#1B8BFF"/>
      <stop offset="75%"  stop-color="#5A4BFF"/>
      <stop offset="100%" stop-color="#B14BFF"/>
    </linearGradient>
    <linearGradient id="gf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2BE9F5"/>
      <stop offset="50%"  stop-color="#2F7BFF"/>
      <stop offset="100%" stop-color="#B14BFF"/>
    </linearGradient>
    <radialGradient id="gb" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1B8BFF" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#1B8BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gv" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#A24BFF" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#A24BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6E4BFF" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#6E4BFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="s" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="t" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="fr"><rect x="0" y="0" width="1280" height="220" rx="14"/></clipPath>

    <style>
      @keyframes dash    { from{stroke-dashoffset:0} to{stroke-dashoffset:-260} }
      @keyframes bob1    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
      @keyframes bob2    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-1.4px)} }
      @keyframes bob3    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-1px)} }
      @keyframes drift   { from{transform:translateX(0)} to{transform:translateX(-100px)} }
      @keyframes breathe { 0%,100%{opacity:.3} 50%{opacity:.85} }
      .lane  { animation: dash 2s linear infinite; }
      .lane2 { animation: dash 3.6s linear infinite; }
      .t1    { animation: bob1 1.8s ease-in-out infinite; }
      .t2    { animation: bob2 2.3s ease-in-out infinite; }
      .t3    { animation: bob3 2.9s ease-in-out infinite; }
      .streak{ animation: drift 1.1s linear infinite; }
      .arc   { animation: breathe 7s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .lane,.lane2,.t1,.t2,.t3,.streak,.arc { animation: none; }
      }
    </style>

    <!-- roda: pneu fixo, aro girando -->
    <g id="roda">
      <circle r="20" fill="#05070F" stroke="#8892BF" stroke-width="3.2"/>
      <g stroke="#6E7CAE" stroke-width="1.8" stroke-linecap="round" opacity=".8">
        <circle r="17.8" fill="none" stroke-dasharray="3 5"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.75s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle r="9.5" fill="#0A1024" stroke="url(#g)" stroke-width="2.6"/>
        <g stroke="#2BE9F5" stroke-width="2" stroke-linecap="round" opacity=".95">
          <line x1="0" y1="-4" x2="0" y2="-9"/>
          <line x1="0" y1="4"  x2="0" y2="9"/>
          <line x1="3.5" y1="2"   x2="7.8" y2="4.5"/>
          <line x1="-3.5" y1="-2" x2="-7.8" y2="-4.5"/>
          <line x1="3.5" y1="-2"  x2="7.8" y2="-4.5"/>
          <line x1="-3.5" y1="2"  x2="-7.8" y2="4.5"/>
        </g>
        <circle r="3" fill="#CFE6FF"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.75s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- VW Delivery 11-150, perfil estilizado. Chao local em y=128 -->
    <g id="truck">
      <rect x="0" y="6" width="214" height="86" rx="5" fill="#070B1C" stroke="url(#g)" stroke-width="2.6"/>
      <line x1="10" y1="72" x2="204" y2="72" stroke="#1B8BFF" stroke-width="1.8" opacity=".45"/>
      <g transform="translate(34,44) scale(.21)" fill="none" stroke="url(#g)" stroke-width="20" opacity=".95">
        <ellipse cx="0" cy="-38" rx="32" ry="34"/>
        <ellipse cx="0" cy="-38" rx="32" ry="34" transform="rotate(72)"/>
        <ellipse cx="0" cy="-38" rx="32" ry="34" transform="rotate(144)"/>
        <ellipse cx="0" cy="-38" rx="32" ry="34" transform="rotate(216)"/>
        <ellipse cx="0" cy="-38" rx="32" ry="34" transform="rotate(288)"/>
      </g>
      <text x="64" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700"
            letter-spacing="1.2" fill="#CFE6FF" opacity=".9">MULTIVERSO</text>
      <path d="M 218 26 L 262 26 Q 268 26 271 31 L 288 52 L 312 56 Q 318 57 318 63 L 318 90 L 218 90 Z"
            fill="#070B1C" stroke="url(#g)" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M 223 33 L 260 33 L 260 54 L 223 54 Z" fill="#1B8BFF" opacity=".28"/>
      <path d="M 265 33 L 271 33 L 286 53 L 265 53 Z" fill="#2BE9F5" opacity=".32"/>
      <rect x="213" y="48" width="9" height="18" rx="3" fill="#2BE9F5" opacity=".65"/>
      <rect x="0" y="90" width="318" height="8" rx="3" fill="#0C1430" stroke="#5A4BFF" stroke-width="1.2"/>
      <circle cx="314" cy="76" r="5" fill="#EAF6FF"/>
      <circle cx="4" cy="80" r="4" fill="#FF4B7A" opacity=".85"/>
      <use href="#roda" x="54"  y="108"/>
      <use href="#roda" x="278" y="108"/>
    </g>
  </defs>

  <g clip-path="url(#fr)">
    <rect width="1280" height="220" fill="#04060F"/>
    <ellipse cx="220"  cy="90"  rx="400" ry="190" fill="url(#gb)"/>
    <ellipse cx="1060" cy="110" rx="400" ry="190" fill="url(#gv)"/>

    <g fill="none" stroke-linecap="round">
      <path class="arc" d="M -40 240 C 140 70, 360 -10, 600 -50"   stroke="#2BE9F5" stroke-width="2" opacity=".45" filter="url(#t)"/>
      <path class="arc" d="M 1320 240 C 1150 70, 930 -10, 690 -50" stroke="#B14BFF" stroke-width="2" opacity=".45" filter="url(#t)"/>
    </g>

    <!-- pista distante -->
    <line x1="0" y1="118" x2="1280" y2="118" stroke="#2BE9F5" stroke-width="1" opacity=".18"/>
    <line class="lane2" x1="0" y1="118" x2="1280" y2="118" stroke="#2BE9F5" stroke-width="1.4"
          stroke-dasharray="26 42" opacity=".16"/>

    <!-- caminhao ao fundo (scale .42, chao em y=118) -->
    <g transform="translate(56,64) scale(.42)" opacity=".34">
      <g class="t3"><use href="#truck"/></g>
    </g>

    <!-- pista intermediaria -->
    <line x1="0" y1="150" x2="1280" y2="150" stroke="#5A4BFF" stroke-width="1" opacity=".18"/>

    <!-- caminhao do meio (scale .62, chao em y=150) -->
    <g transform="translate(264,76) scale(.58)" opacity=".62">
      <ellipse cx="160" cy="128" rx="170" ry="11" fill="#8A4BFF" opacity=".45" filter="url(#s)"/>
      <g class="t2"><use href="#truck"/></g>
    </g>

    <!-- piso principal -->
    <rect x="0" y="176" width="1280" height="44" fill="url(#ff)"/>
    <line x1="0" y1="176" x2="1280" y2="176" stroke="url(#gf)" stroke-width="2.4" filter="url(#t)"/>
    <line x1="0" y1="176" x2="1280" y2="176" stroke="#ffffff" stroke-width=".6" opacity=".55"/>
    <line class="lane" x1="0" y1="204" x2="1280" y2="204" stroke="#2BE9F5" stroke-width="2"
          stroke-dasharray="48 36" opacity=".26"/>

    <!-- caminhao da frente (scale 1, chao em y=176) -->
    <g transform="translate(742,48)">
      <g class="streak" stroke="#2BE9F5" stroke-width="2.4" stroke-linecap="round" opacity=".5">
        <line x1="-150" y1="26" x2="-70"  y2="26"/>
        <line x1="-160" y1="58" x2="-56"  y2="58"/>
        <line x1="-140" y1="86" x2="-62"  y2="86"/>
        <line x1="-158" y1="42" x2="-104" y2="42"/>
      </g>
      <ellipse cx="160" cy="128" rx="180" ry="13" fill="#8A4BFF" opacity=".55" filter="url(#s)"/>
      <g class="t1"><use href="#truck"/></g>
      <g opacity=".13" transform="translate(0,256) scale(1,-1)" filter="url(#s)">
        <rect x="0" y="6" width="214" height="86" rx="5" fill="none" stroke="url(#g)" stroke-width="2.6"/>
        <path d="M 218 26 L 262 26 L 288 52 L 318 56 L 318 90 L 218 90 Z" fill="none" stroke="url(#g)" stroke-width="2.6"/>
      </g>
    </g>

    <text x="34" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600"
          letter-spacing="3.2" fill="#9FC2EA" opacity=".8">FROTA MULTIVERSO · VW DELIVERY 11-150</text>

    <rect x="1" y="1" width="1278" height="218" rx="14" fill="none" stroke="#2BE9F5" stroke-width="1" opacity=".2"/>
  </g>
</svg>
